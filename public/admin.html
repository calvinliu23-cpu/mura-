<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>婚禮賽車大戰 - 後台管理</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css" />
<style>body { background: #0f172a; }</style>
</head>
<body class="min-h-screen text-white p-6">
  <div class="max-w-5xl mx-auto">
    <h1 class="text-3xl font-black mb-1">🎛️ 婚禮賽車大戰 — 後台管理</h1>
    <p id="statusBadge" class="inline-block px-3 py-1 rounded-full bg-slate-700 text-sm mb-6">狀態：WAITING</p>

    <div class="grid md:grid-cols-2 gap-6">

      <!-- 設定區 -->
      <section class="bg-slate-800 rounded-2xl p-5 space-y-5">
        <h2 class="text-xl font-bold border-b border-slate-600 pb-2">⚙️ 賽事設定</h2>

        <div class="grid grid-cols-2 gap-4">
          <div class="space-y-2">
            <label class="text-sm text-blue-300 font-bold">隊伍 A（男方）</label>
            <input id="teamAName" type="text" placeholder="男方親友隊" maxlength="20"
              class="w-full rounded-lg px-3 py-2 bg-slate-700 border border-slate-600 outline-none" />
            <input id="teamAAvatarFile" type="file" accept="image/*" class="text-xs w-full" />
            <img id="teamAAvatarPreview" class="w-16 h-16 rounded-full object-cover hidden border-2 border-blue-400" />
          </div>
          <div class="space-y-2">
            <label class="text-sm text-pink-300 font-bold">隊伍 B（女方）</label>
            <input id="teamBName" type="text" placeholder="女方親友隊" maxlength="20"
              class="w-full rounded-lg px-3 py-2 bg-slate-700 border border-slate-600 outline-none" />
            <input id="teamBAvatarFile" type="file" accept="image/*" class="text-xs w-full" />
            <img id="teamBAvatarPreview" class="w-16 h-16 rounded-full object-cover hidden border-2 border-pink-400" />
          </div>
        </div>

        <div>
          <label class="text-sm text-slate-300 font-bold">遊戲時長（秒）</label>
          <input id="durationInput" type="number" min="10" max="600" value="90"
            class="w-32 rounded-lg px-3 py-2 bg-slate-700 border border-slate-600 outline-none" />
        </div>

        <button id="saveConfigBtn" class="w-full py-3 rounded-xl bg-indigo-500 hover:bg-indigo-400 font-bold transition">
          💾 儲存設定
        </button>
        <p id="configSaved" class="text-green-400 text-sm text-center hidden">已同步到大螢幕 ✓</p>
      </section>

      <!-- 流程控制 -->
      <section class="bg-slate-800 rounded-2xl p-5 space-y-3">
        <h2 class="text-xl font-bold border-b border-slate-600 pb-2">🕹️ 流程控制</h2>

        <button id="btnQR" class="w-full py-3 rounded-xl bg-slate-600 hover:bg-slate-500 font-bold transition">
          📱 顯示 QR Code（回到等待畫面）
        </button>
        <button id="btnCountdown" class="w-full py-3 rounded-xl bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold transition">
          ⏱️ 開始倒數 (3-2-1)
        </button>
        <button id="btnStart" class="w-full py-3 rounded-xl bg-green-500 hover:bg-green-400 text-slate-900 font-bold transition">
          🏁 遊戲開始（啟動計時與計分）
        </button>
        <div class="grid grid-cols-2 gap-3">
          <button id="btnForceEnd" class="py-3 rounded-xl bg-orange-500 hover:bg-orange-400 font-bold transition">
            ⏹️ 強制結束
          </button>
          <button id="btnReset" class="py-3 rounded-xl bg-red-600 hover:bg-red-500 font-bold transition">
            🔄 重置遊戲
          </button>
        </div>

        <div class="pt-2 border-t border-slate-600 mt-2">
          <div class="flex justify-between text-sm text-slate-300 mb-1">
            <span>⏳ 剩餘時間</span><span id="liveTimer">--</span>
          </div>
          <div class="flex justify-between text-lg font-black">
            <span class="text-blue-300" id="liveTeamAScore">A: 0</span>
            <span class="text-pink-300" id="liveTeamBScore">B: 0</span>
          </div>
        </div>
      </section>
    </div>

    <!-- 即時玩家列表 -->
    <section class="bg-slate-800 rounded-2xl p-5 mt-6">
      <h2 class="text-xl font-bold border-b border-slate-600 pb-2 mb-3">👥 即時玩家名單（依點擊數排序）</h2>
      <div class="flex gap-4 text-sm text-slate-400 mb-2">
        <span>在線人數：<span id="onlineCount" class="text-white font-bold">0</span></span>
      </div>
      <div id="playerList" class="max-h-64 overflow-y-auto text-sm divide-y divide-slate-700"></div>
    </section>

    <!-- 結算結果 -->
    <section id="resultSection" class="hidden bg-slate-800 rounded-2xl p-5 mt-6 border-2 border-yellow-400">
      <h2 class="text-xl font-bold mb-3">🏆 結算結果</h2>
      <p id="resultWinner" class="text-lg font-black mb-1"></p>
      <p id="resultMvp" class="text-yellow-300 font-bold"></p>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
